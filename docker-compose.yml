version: '3.8'
services:
  repair-base-server:
    container_name: repair-base-container
    build: .
    image: ghcr.io/redwan002117/repair-base-app:main
    ports:
      - "6969:80"
    restart: unless-stopped

# CasaOS Metadata
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: repair-base-app
  description:
    en: "RepairBase Pro is an AI-powered repair estimate converter tool."
  tagline:
    en: "AI Repair Estimate Converter"
  developer: "Redwan"
  author: "Redwan"
  icon: "https://raw.githubusercontent.com/Redwan002117/repair-base-app/main/public/vite.svg" # Placeholder icon, ideally should be a real URL
  thumbnail: "https://raw.githubusercontent.com/Redwan002117/repair-base-app/main/public/vite.svg"
  title:
    en: "RepairBase Pro"
  category: "Productivity"
  port_map: "6969"
