services:
  repair-base-server:
    container_name: repair-base-container
    image: ghcr.io/redwan002117/repair-base-app:main
    ports:
      - "6969:80"
    volumes:
      - ./data:/app/data
    environment:
      - VITE_GEMINI_API_KEY=change_me
    command: >
      sh -c "echo 'window.env = { VITE_GEMINI_API_KEY: \"'$VITE_GEMINI_API_KEY'\" };' > /usr/share/nginx/html/config.js && nginx -g 'daemon off;'"
    restart: unless-stopped

# CasaOS Metadata
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: repair-base-server
  description:
    en: "RepairBase Pro is an AI-powered repair estimate converter tool."
  tagline:
    en: "AI Repair Estimate Converter"
  developer: "Redwan"
  author: "Redwan"
  icon: "https://raw.githubusercontent.com/Redwan002117/repair-base-app/main/public/vite.svg"
  thumbnail: "https://raw.githubusercontent.com/Redwan002117/repair-base-app/main/public/vite.svg"
  title:
    en: "RepairBase Pro"
  category: "Productivity"
  port_map: "6969"
