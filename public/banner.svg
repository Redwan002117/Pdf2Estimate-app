<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="gradBg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </radialGradient>
    <pattern id="gridSmall" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#gradBg)" />
  <rect width="100%" height="100%" fill="url(#gridSmall)" />

  <!-- Animated Data Streams -->
  <path d="M0 100 L1200 100" stroke="#2563eb" stroke-width="1" opacity="0.3" stroke-dasharray="10,20">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="20s" repeatCount="indefinite" />
  </path>
  <path d="M0 530 L1200 530" stroke="#9333ea" stroke-width="1" opacity="0.3" stroke-dasharray="10,20">
     <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="20s" repeatCount="indefinite" />
  </path>

  <!-- Central Badge Area -->
  <circle cx="200" cy="315" r="140" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.5" />
  <circle cx="200" cy="315" r="120" fill="none" stroke="#9333ea" stroke-width="4" stroke-dasharray="60, 40">
    <animateTransform attributeName="transform" type="rotate" from="0 200 315" to="360 200 315" dur="30s" repeatCount="indefinite" />
  </circle>

  <!-- Text -->
  <text x="400" y="280" font-family="'Orbitron', 'Arial', sans-serif" font-weight="900" font-size="90" fill="#fff" letter-spacing="4" filter="url(#textGlow)">PDF2ESTIMATE</text>
  <text x="405" y="360" font-family="'Arial', sans-serif" font-weight="bold" font-size="40" fill="#22d3ee" letter-spacing="8">INTELLIGENT REPAIR AI</text>

  <!-- Mockup Preview Rect -->
  <g transform="translate(850, 180) rotate(10)">
    <rect x="0" y="0" width="250" height="300" rx="15" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" opacity="0.9" />
    <rect x="20" y="20" width="210" height="40" rx="5" fill="#334155" />
    <rect x="20" y="80" width="210" height="10" rx="2" fill="#475569" />
    <rect x="20" y="100" width="180" height="10" rx="2" fill="#475569" />
    <rect x="20" y="120" width="200" height="10" rx="2" fill="#475569" />
    <!-- Glowing element on card -->
    <circle cx="220" cy="270" r="15" fill="#10b981" filter="url(#textGlow)" />
  </g>
</svg>
