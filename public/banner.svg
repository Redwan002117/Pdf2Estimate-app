<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Modern Cyber Palette -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Data Streams (Lines) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="10,20">
      <animate attributeName="stroke-dashoffset" from="0" to="-300" duration="10s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="530" x2="1200" y2="530" stroke-dasharray="20,40">
      <animate attributeName="stroke-dashoffset" from="0" to="600" duration="15s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Central Composition -->
  <g transform="translate(600, 315)">
    <!-- Hexagon Container Base -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" />
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="#1e293b" stroke="url(#textGrad)" stroke-width="4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" duration="3s" repeatCount="indefinite" />
    </polygon>

    <!-- Main Text -->
    <text x="0" y="-20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="72" fill="white" text-anchor="middle" letter-spacing="2">
      PDF<tspan fill="url(#textGrad)">2</tspan>ESTIMATE
    </text>
    <text x="0" y="40" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="6">
      INTELLIGENT REPAIR AI
    </text>

    <!-- Visual Icons: PDF -> arrow -> Excel -->
    <g transform="translate(-250, 100)" filter="url(#glow)">
        <!-- PDF Icon Style -->
        <rect x="0" y="0" width="60" height="80" rx="5" fill="#ef4444" opacity="0.8" />
        <path d="M15,20 L45,20 M15,40 L45,40 M15,60 L35,60" stroke="white" stroke-width="4" stroke-linecap="round" />
        <text x="30" y="110" fill="#ef4444" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">PDF</text>
    </g>

    <!-- Arrow Animating -->
    <g transform="translate(-30, 130)">
        <path d="M0,0 L60,0" stroke="url(#textGrad)" stroke-width="4" marker-end="url(#arrowhead)">
            <animate attributeName="stroke-dasharray" values="0,100;100,0" duration="2s" repeatCount="indefinite" />
        </path>
        <polygon points="60,-5 70,0 60,5" fill="#a855f7" />
    </g>

    <g transform="translate(190, 100)" filter="url(#glow)">
        <!-- Excel Icon Style -->
        <rect x="0" y="0" width="60" height="80" rx="5" fill="#22c55e" opacity="0.8" />
        <path d="M10,10 L50,10 M10,30 L50,30 M10,50 L50,50 M30,10 L30,70" stroke="white" stroke-width="2" />
        <text x="30" y="110" fill="#22c55e" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">EXCEL</text>
    </g>
  </g>
  
  <!-- Corner Accents -->
  <path d="M50,50 L150,50 M50,50 L50,150" stroke="#38bdf8" stroke-width="4" fill="none" filter="url(#glow)" />
  <path d="M1150,580 L1050,580 M1150,580 L1150,480" stroke="#a855f7" stroke-width="4" fill="none" filter="url(#glow)" />

</svg>
