<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" /> <!-- Blue-600 -->
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" /> <!-- Purple-600 -->
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background Hexagon -->
  <path d="M256 20 L480 140 L480 372 L256 492 L32 372 L32 140 Z" fill="#0f172a" stroke="url(#gradMain)" stroke-width="10" />
  <path d="M256 35 L465 145 L465 365 L256 477 L47 365 L47 145 Z" fill="url(#grid)" opacity="0.5" />

  <!-- Inner Circuitry -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="20,10" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="20s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="256" cy="256" r="70" fill="none" stroke="#9333ea" stroke-width="4" stroke-dasharray="10,5">
    <animateTransform attributeName="transform" type="rotate" from="360 256 256" to="0 256 256" dur="15s" repeatCount="indefinite" />
  </circle>

  <!-- Central Monogram P2E -->
  <path d="M200 180 L200 332 M200 180 L260 180 C290 180 290 240 260 240 L200 240" stroke="#fff" stroke-width="25" stroke-linecap="round" fill="none" filter="url(#neonGlow)" />
  <path d="M320 256 L350 256 L320 332 L350 332 M320 256 L350 256 L320 180 L350 180" stroke="#fff" stroke-width="25" stroke-linecap="round" fill="none" filter="url(#neonGlow)" transform="translate(40,0)" />

</svg>
