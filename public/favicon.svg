<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect width="512" height="512" rx="120" fill="#0f172a" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#gradSmall)" stroke-width="30" />
  
  <!-- "P2" Symbol -->
  <text x="50%" y="60%" font-family="Arial, sans-serif" font-weight="900" font-size="280" fill="#fff" text-anchor="middle" letter-spacing="-10">P2</text>
  
  <!-- Glowing Dot -->
  <circle cx="400" cy="120" r="40" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
